name: Publish Go package
run-name: Go ${{ inputs.release-state }} v${{ inputs.package-version }} (${{ inputs.operation-id }})

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: Go module version without the leading v
        required: true
        type: string
      published-core-version:
        description: Published Serverless Compatibility Layer version without the leading v
        required: true
        type: string
      immutable-base-commit:
        description: Full commit SHA used to prepare the release branch
        required: true
        type: string
      operation-id:
        description: Immutable parent release operation identifier
        required: true
        type: string
      release-state:
        description: Prepare a draft or publish the prepared release
        required: true
        type: choice
        options:
          - draft
          - published

concurrency:
  group: go-release-${{ inputs.package-version }}
  cancel-in-progress: false

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - name: Authorize release request
        env:
          EXPECTED_ACTOR: ${{ vars.RELEASE_AUTOMATION_ACTOR }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CORE_VERSION: ${{ inputs.published-core-version }}
          BASE_SHA: ${{ inputs.immutable-base-commit }}
          OPERATION_ID: ${{ inputs.operation-id }}
          RELEASE_STATE: ${{ inputs.release-state }}
        run: |
          set -euo pipefail

          if [[ -z "$EXPECTED_ACTOR" ]]; then
            echo "RELEASE_AUTOMATION_ACTOR must be set to the observed managed App actor" >&2
            exit 1
          fi
          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$ACTOR" == "$EXPECTED_ACTOR" ]]
          [[ "$TRIGGERING_ACTOR" == "$EXPECTED_ACTOR" ]]
          [[ "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$CORE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]
          [[ "$RELEASE_STATE" == "draft" || "$RELEASE_STATE" == "published" ]]

  prepare-draft:
    if: inputs.release-state == 'draft'
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b22fbbc2921299758641fab08929b4ac52b32923
        with:
          go-version: '1.20.0'
      - name: Prepare tested release commit, PR, and draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CORE_VERSION: ${{ inputs.published-core-version }}
          BASE_SHA: ${{ inputs.immutable-base-commit }}
          OPERATION_ID: ${{ inputs.operation-id }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash .github/scripts/go-release.sh draft

  publish-release:
    if: inputs.release-state == 'published'
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tag tested commit and publish its draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          CORE_VERSION: ${{ inputs.published-core-version }}
          BASE_SHA: ${{ inputs.immutable-base-commit }}
          OPERATION_ID: ${{ inputs.operation-id }}
          DISPATCH_SHA: ${{ github.sha }}
        run: bash .github/scripts/go-release.sh published
